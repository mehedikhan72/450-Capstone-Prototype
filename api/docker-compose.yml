services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ddos
      POSTGRES_USER: ddos
      POSTGRES_PASSWORD: ddos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddos"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://ddos:ddos@postgres:5432/ddos
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      INPUT_DIR: /app/input
      OUTPUT_DIR: /app/output
      # Fallback switching rule, used when a request does not carry its own.
      # The ns-3 control frontend sends thresholds per job, so these are defaults only.
      FLOW_THRESHOLD_HIGH: "${FLOW_THRESHOLD_HIGH:-1000}"
      FLOW_THRESHOLD_EXTREME: "${FLOW_THRESHOLD_EXTREME:-5000}"
      FEEDBACK_API_KEY: "${FEEDBACK_API_KEY:-}"
      BASE_DATASET_PATH: /data/DDoS_Dataset.zip
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./data/DDoS_Dataset.zip:/data/DDoS_Dataset.zip:ro
      - ./detection-engine/weights:/app/detection-engine/weights:ro
      - model_registry:/registry
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-blue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q inference_blue
    environment:
      DATABASE_URL: postgresql+psycopg2://ddos:ddos@postgres:5432/ddos
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      INPUT_DIR: /app/input
      OUTPUT_DIR: /app/output
      FLOW_THRESHOLD_HIGH: "${FLOW_THRESHOLD_HIGH:-1000}"
      FLOW_THRESHOLD_EXTREME: "${FLOW_THRESHOLD_EXTREME:-5000}"
      MODEL_SLOT: blue
      MODEL_REGISTRY_DIR: /registry
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./detection-engine/weights:/app/detection-engine/weights:ro
      - model_registry:/registry
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-green:
    extends: worker-blue
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q inference_green
    environment:
      MODEL_SLOT: green

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 -Q training
    environment:
      DATABASE_URL: postgresql+psycopg2://ddos:ddos@postgres:5432/ddos
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      WORKER_ROLE: training
      BASE_DATASET_PATH: /data/DDoS_Dataset.zip
      MODEL_REGISTRY_DIR: /registry
    volumes:
      - ./detection-engine/weights:/app/detection-engine/weights:ro
      - ./data/DDoS_Dataset.zip:/data/DDoS_Dataset.zip:ro
      - model_registry:/registry
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  model_registry:
